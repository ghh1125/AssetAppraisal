      "template": "（二）{asset_approach_method_label}介绍"
    },
    {
      "part": "word/document.xml",
      "paragraph_index": 485,
      "value": "资产基础法是指以被评估单位评估基准日的资产负债表为基础，对企业各项资产、负债价值逐项清查、逐项评估，最终采用评估总资产价值扣减评估总负债价值，确定评估对象价值的方法。"
    },
    {
      "part": "word/document.xml",
      "paragraph_index": 486,
      "value": "采用资产基础法评估时，应根据各项资产的具体情况选择适当的评估方法，逐项确定资产和负债的评估价值。"
    },
    {
      "part": "word/document.xml",
      "paragraph_index": 487,
      "value": "资产基础法的评估结果能够反映被评估单位评估基准日各项资产、负债的重置或市场价值情况。"
    },
    {
      "part": "word/document.xml",
      "paragraph_index": 559,
      "template": "采用{asset_approach_method_label}对企业{target_company_name}价值进行评估，得出被评估单位在评估基准日的评估结果如下："
    },
    {
      "part": "word/document.xml",
      "paragraph_index": 332,
      "field_key": "valuation_scope"
    },
    {
      "part": "word/document.xml",
      "paragraph_index": 420,
      "template": "被评估单位办公用房位于{office_address}，系租赁使用，已在使用权资产科目核算。",
      "blank_if_empty": "office_address"
    },
    {
      "part": "word/document.xml",
      "paragraph_index": 379,
      "template": "截止报告出具日，{target_company_name}申报的账外无形资产情况如下："
    },
    {
      "part": "word/document.xml",
      "paragraph_index": 380,
      "value": "1、已申请注册的商标"
    }
  ],
