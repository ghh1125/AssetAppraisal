  "llm_fallback_fields": {
    "company_profile_section": "通富热处理（昆山）有限公司系由上海上大热处理有限公司和富士和机械工业（昆山）有限公司出资组建的有限责任公司，于2011年2月25日成立，注册资本人民币1,000万元。公司经营范围为各类汽车零部件的热处理加工，并提供相关技术开发、技术咨询及售后服务。",
    "industry_overview": "所处行业及行业介绍：公司所处业务属于汽车零部件热处理及金属表面处理服务领域。审计报告披露的经营范围包括各类汽车零部件热处理加工及相关技术服务。",
    "business_and_segments": "业务内容及细分市场：公司开展汽车零部件热处理加工、技术开发、技术咨询及售后服务；审计报告同时披露其子公司通富新材料科技（仙桃）有限公司开展汽车零部件研发、金属表面处理及热处理加工等业务。",
    "main_products": "主要产品：汽车零部件热处理加工服务，以及与热处理相关的技术开发、技术咨询和售后服务。",
    "customers_suppliers": "主要客户、供应商：审计报告披露的主要客户包括富士和机械工业（昆山）有限公司、富士和机械工业（湖北）有限公司；主要供应商包括上海麦睿菱测量技术有限公司、兴化市恒鑫机械有限公司。",
    "profit_model_swot": "盈利模式，SWOT分析：公司收入主要来自汽车零部件热处理加工及相关技术服务，2025年上半年审计报表列示主营业务收入21,652,412.25元。基于现有审计资料，公司具备既有客户和专业加工业务基础；成本、客户集中度、产能及市场竞争等优势、劣势、机会和威胁仍应结合现场及市场资料复核。",
