{
  "version": "2.0.0",
  "contract_version": "workflow_contract.v2",
  "nodes": [
    {
      "name": "start_input",
      "description": "接收用户填写的基础信息、PDF和Excel材料，并使用后台只读模板。",
      "input_model": "StartInput",
      "output_model": "StartOutput",
      "depends_on": [],
      "human_checkpoint": null
    },
    {
      "name": "ocr_llm_candidates",
      "description": "有PDF时执行OCR并形成结构化数据；百炼模型为Word固定LLM位置生成全部候选文本，暂停等待用户选择。",
      "input_model": "CandidateGenerationInput",
      "output_model": "CandidateGenerationOutput",
      "depends_on": ["start_input"],
      "human_checkpoint": "用户逐项选择要写入Word的LLM候选内容"
    },
    {
      "name": "fill_word",
      "description": "将人工、Excel、OCR、企查查和用户选中的LLM内容按模板映射写入新Word，不修改原模板。",
      "input_model": "WordFillInput",
      "output_model": "WordFillOutput",
      "depends_on": ["ocr_llm_candidates"],
      "human_checkpoint": null
    },
    {
      "name": "output",
      "description": "输出Word、字段审计清单和带实际页码的问题清单；找不到的内容保留并高亮XXX。",
      "input_model": "OutputInput",
      "output_model": "OutputOutput",
      "depends_on": ["fill_word"],
      "human_checkpoint": "人工下载并复核Word和问题清单"
    }
  ]
}
